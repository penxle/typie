fragment EntityIcon_entity on Entity {
  id
  type
  icon
  iconColor
}

fragment EntityRowPath_entity on Entity {
  id

  ancestors {
    id

    node {
      __typename

      ... on Folder {
        id
        name
      }

      ... on Document {
        id
      }

      ... on Divider {
        id
      }
    }
  }
}

fragment EntityRowDocument_document on Document {
  id
  title
  subtitle
  excerpt
  updatedAt
}

fragment EntityRowFolder_folder on Folder {
  id
  name
  folderCount
  documentCount
}

fragment EntityRow_entity on Entity {
  id
  ...EntityIcon_entity

  node {
    __typename

    ... on Folder {
      id
      ...EntityRowFolder_folder
    }

    ... on Document {
      id
      ...EntityRowDocument_document
    }

    ... on Divider {
      id
    }
  }
}
