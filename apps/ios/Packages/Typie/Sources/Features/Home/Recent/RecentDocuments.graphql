fragment RecentDocument_document on Document {
  id

  entity {
    id
    viewedAt
    ...EntityRow_entity
  }
}

query RecentDocuments_Query($siteId: ID!, $sort: RecentDocumentSort!) {
  site(siteId: $siteId) {
    id

    recentDocuments(sort: $sort, limit: 50) {
      documents {
        id
        ...RecentDocument_document
      }
    }
  }
}
