fragment UserGoalSection_user on User {
  id
  goal {
    id
    targetCharacterCount
  }
  goalHistory {
    date
    targetCharacterCount
    additions
    achieved
  }
  todayCharacterCountChange {
    date
    additions
  }
}

fragment HomeTree_entity on Entity {
  id
  ...EntityRow_entity

  node {
    __typename

    ... on Folder {
      id
      childCount
    }
  }
}

fragment HomeScreen_site on Site {
  id
  name

  pinnedEntities {
    id
    ...HomeTree_entity
  }

  recentlyViewedDocuments: recentDocuments(sort: VIEWED_AT, limit: 5) {
    documents {
      id
      ...RecentDocument_document
    }
  }

  recentlyUpdatedDocuments: recentDocuments(sort: UPDATED_AT, limit: 5) {
    documents {
      id
      ...RecentDocument_document
    }
  }

  entities {
    id
    ...HomeTree_entity
  }
}

query HomeScreen_Query($siteId: ID!) {
  me {
    id
    ...UserGoalSection_user
  }

  site(siteId: $siteId) {
    id
    ...HomeScreen_site
  }
}

query HomeTree_Children_Query($entityId: ID!) {
  entity(entityId: $entityId) {
    id
    ...HomeTree_entity

    children {
      id
      ...HomeTree_entity
    }
  }
}
