subscription AiFeedback_LiteraryAnalysisDocumentStream_Subscription($text: String!, $documentId: ID) {
  literaryAnalysisDocumentStreamV2(text: $text, documentId: $documentId) {
    type
    feedback {
      id
      start
      end
      startText
      endText
      feedback
      category
    }
    progress {
      current
      total
      phase
    }
  }
}
