name = "typie-landing"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_als"]
workers_dev = false

routes = [{ pattern = "landing.penxle.io", custom_domain = true }]

[vars]
API_ORIGIN = "https://api.typie.co"

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability.logs]
enabled = true
invocation_logs = true
